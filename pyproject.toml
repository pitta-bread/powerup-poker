[project]
name = "powerup-poker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pbeards", email = "peterbeardsmore@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.42",
]

[project.scripts]
powerup-poker = "powerup_poker:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
